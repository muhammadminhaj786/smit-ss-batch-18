<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="calStyle.css">
  </head>
  <body>
    <div class="parent">
      <input type="text" id="inp" placeholder="00" />
        <div class="cal-body">
      <div class="row1">
        <button onclick="allClear()">Ac</button>
        <button onclick="clearOne()">C</button>
        <button onclick="setNumber('%')" >%</button>
        <button onclick="setNumber('/')" class="bgorange">/</button>
      </div>
      <div class="row2">
        <button onclick="setNumber('7')" >7</button>
        <button onclick="setNumber('8')" >8</button>
        <button onclick="setNumber('9')" >9</button>
        <button onclick="setNumber('*')"  class="bgorange">*</button>
      </div>
      <div class="row3">
        <button onclick="setNumber('4')" >4</button>
        <button onclick="setNumber('5')" >5</button>
        <button onclick="setNumber('6')" >6</button>
        <button onclick="setNumber('-')"  class="bgorange">-</button>
      </div>
      <div class="row4">
        <button onclick="setNumber('1')" >1</button>
        <button onclick="setNumber('2')" >2</button>
        <button onclick="setNumber('3')" >3</button>
        <button onclick="setNumber('+')"  class="bgorange">+</button>
      </div>
      <div class="row5">
        <button onclick="setNumber('.')" >.</button>
        <button onclick="setNumber('0')" >0</button>
        <button onclick="setNumber('00')" >00</button>
        <button onclick="cal()"  class="bgorange">=</button>
      </div>
    </div>
    </div>
  
  </body>
  <script src="calculator.js"></script>
</html>
